name: Vérifier chiffrement pack avec le secret MAJ
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-encrypted-pack-with-maj-secret.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-secret-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Charger outil d'import documentaire vérifié
        uses: actions/checkout@v4
        with:
          repository: mini56/ECU-Mems-Manager-Session
          ref: 0fc83fbc03fc663001c915e1ae05b9d366fa92d4
          path: mems-source
      - name: Installer cryptographie Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user 'cryptography>=42,<47'
      - name: Préparer un corpus CI de vérification (non publiable)
        shell: bash
        working-directory: mems-source
        run: |
          set -euo pipefail
          mkdir -p output/rave-fr output/verification
          python3 tools/build_rave_fr_documentary.py \
            --reference-root database/reference \
            --output output/rave-fr/mems_documentary_fr.sqlite
          python3 tools/test_documentary_fixture.py --source output/rave-fr
          # Ajout de 20 pages SPi factices et de 429 lignes synthétiques.
          python3 tools/test_documentary_multisource_fixture.py --source output/rave-fr
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('output/rave-fr')
          with zipfile.ZipFile('output/verification/synthetic-fr.zip','w',
                               zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and (p.suffix=='.sqlite' or p.parent.name=='images'):
                      archive.write(p,p.relative_to(root))
          print('MAJ_SYNTHETIC_TWO_DOCUMENT_PACK_391P_FOR_CI_ONLY')
          PY
      - name: Contrôler le vrai secret admin MAJ sans le divulguer
        shell: bash
        working-directory: mems-source
        env:
          MEMS_DOCUMENTARY_PUBLISH_PASSWORD: ${{ secrets.MEMS_DOCUMENTARY_PUBLISH_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$MEMS_DOCUMENTARY_PUBLISH_PASSWORD" ]]; then
            echo MAJ_SECRET_UNAVAILABLE
            exit 1
          fi
          python3 tools/pack_mems_documentary.py \
            --source-zip output/verification/synthetic-fr.zip \
            --language fr \
            --output output/verification/synthetic-fr.encrypted
          python3 - <<'PY'
          import hashlib,os,struct
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.exceptions import InvalidTag
          r=Path('output/verification')
          encrypted=(r/'synthetic-fr.encrypted').read_bytes()
          plain=(r/'synthetic-fr.zip').read_bytes()
          assert encrypted[:8]==b'MEMSDOC1' and encrypted[8]==1
          assert struct.unpack_from('<Q',encrypted,37)[0]==len(plain)
          secret=os.environ['MEMS_DOCUMENTARY_PUBLISH_PASSWORD'].encode('utf-8')
          key=hashlib.pbkdf2_hmac('sha256',secret,encrypted[9:25],210000,32)
          assert AESGCM(key).decrypt(encrypted[25:37],
                                     encrypted[45:],encrypted[:45])==plain
          bad=hashlib.pbkdf2_hmac('sha256',b'WRONG_PASSWORD',
                                  encrypted[9:25],210000,32)
          try:
              AESGCM(bad).decrypt(encrypted[25:37],encrypted[45:],encrypted[:45])
          except InvalidTag:
              pass
          else:
              raise AssertionError('WRONG_PASSWORD_ACCEPTED')
          tampered=bytearray(encrypted)
          tampered[-18]^=1
          try:
              AESGCM(key).decrypt(encrypted[25:37],bytes(tampered[45:]),
                                  encrypted[:45])
          except InvalidTag:
              pass
          else:
              raise AssertionError('TAMPER_ACCEPTED')
          print('MAJ_ADMIN_SECRET_ENCRYPTION_AND_AUTHENTICATION_PASS')
          print('NO_MANUFACTURER_CONTENT_OR_SECRET_PUBLISHED')
          PY
