name: Préparer un dépôt de pack documentaire (brouillon privé)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Nouveau tag de version (ex. mems-doc-20261114-v2)
        required: true
        type: string
      title:
        description: Nom de la mise à jour (ex. Bases documentaires novembre 2026)
        required: true
        type: string
permissions:
  contents: write
jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ouvrir une nouvelle Release brouillon
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          INPUT_TAG: '${{ inputs.release_tag }}'
          INPUT_TITLE: '${{ inputs.title }}'
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,43}$ ]]; then
            echo INVALID_DOCUMENTARY_TAG
            exit 1
          fi
          if [[ -z "$INPUT_TITLE" ]]; then
            echo EMPTY_DOCUMENTARY_TITLE
            exit 1
          fi
          if gh release view "$INPUT_TAG" \
            --repo mini56/ECU-Mems-Manager-Session-MAJ >/dev/null 2>&1; then
            echo DOCUMENTARY_RELEASE_ALREADY_EXISTS
            exit 0
          fi
          gh release create "$INPUT_TAG" \
            --repo mini56/ECU-Mems-Manager-Session-MAJ \
            --title "$INPUT_TITLE" \
            --notes 'Dépôt de préparation. Aucun contenu constructeur ne doit être rendu public sans autorisation écrite de redistribution. Ajouter les snapshots chiffrés autorisés en pièces jointes, puis valider avant publication.' \
            --draft
          gh release view "$INPUT_TAG" \
            --repo mini56/ECU-Mems-Manager-Session-MAJ \
            --json tagName,isDraft,assets \
            --jq '{tag:.tagName,draft:.isDraft,asset_count:(.assets|length)}'
