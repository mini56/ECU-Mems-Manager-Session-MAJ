name: Activer les bases documentaires vérifiées sur le site MAJ
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag de la nouvelle Release contenant les packs chiffrés autorisés
        required: true
        type: string
      language:
        description: Langue du pack (both = français et anglais)
        required: true
        type: choice
        options: [both, fr, en, pt, es, it, de]
        default: both
permissions:
  contents: write
concurrency:
  group: official-documentary-maj-manifest
  cancel-in-progress: false
jobs:
  verify-and-enable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Vérifier le tag, la Release et les packs
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          INPUT_TAG: '${{ inputs.release_tag }}'
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,43}$ ]]; then
            echo INVALID_RELEASE_TAG
            exit 1
          fi
          gh release view "$INPUT_TAG" \
            --repo mini56/ECU-Mems-Manager-Session-MAJ \
            --json isDraft,tagName \
            --jq 'if (.isDraft == false) then "PUBLISHED_RELEASE_PRESENT" else error("RELEASE_IS_DRAFT") end'
          mkdir -p candidate-assets
          gh release download "$INPUT_TAG" \
            --repo mini56/ECU-Mems-Manager-Session-MAJ \
            --pattern 'MEMS-DOC-*.encrypted' --dir candidate-assets
          test -n "$(find candidate-assets -maxdepth 1 -type f -name '*.encrypted' -print -quit)"
      - name: Installer le moteur de déchiffrement
        run: python3 -m pip install --user 'cryptography>=42,<47'
      - name: Vérifier et activer la nouvelle version de chaque langue
        shell: bash
        env:
          MEMS_DOCUMENTARY_PUBLISH_PASSWORD: '${{ secrets.MEMS_DOCUMENTARY_PUBLISH_PASSWORD }}'
          INPUT_TAG: '${{ inputs.release_tag }}'
          LANGUAGES: '${{ inputs.language }}'
        run: |
          set -euo pipefail
          set +x
          python3 bases/tools/verify_licensed_release_and_enable.py \
            --manifest manifest.json \
            --asset-dir candidate-assets \
            --tag "$INPUT_TAG" \
            --language "$LANGUAGES"
          python3 bases/tests/test_schema_multidoc.py
      - name: Mettre à jour le manifeste uniquement après validation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- manifest.json; then
            echo MANIFEST_ALREADY_CURRENT
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- manifest.json
          git commit -m 'Publish next verified documentary snapshot'
          git push origin HEAD:${{ github.ref_name }}
          echo DOCUMENTARY_UPDATE_AVAILABLE
