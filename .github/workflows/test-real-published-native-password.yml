name: Verifier le mot de passe des vraies bases sur Windows (AES-GCM)
on:
  push:
    branches: [main]
    paths:
      - 'bases/tests/real_published_windows_decrypt.cpp'
      - '.github/workflows/test-real-published-native-password.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows-authentication:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Recuperer le test du depot MAJ
        uses: actions/checkout@v4
      - name: Recuperer le vrai code source de SESSION
        uses: actions/checkout@v4
        with:
          repository: mini56/ECU-Mems-Manager-Session
          ref: rave-fr-source-sqlite-20261112
          path: session-src
      - name: Preparer Qt 5.15.2 et le compilateur Windows
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'aqtinstall==3.3.0'
          if($LASTEXITCODE -ne 0){throw 'QT_TOOL_INSTALL_FAILED'}
          $sevenZip=(Get-Command 7z.exe -ErrorAction Stop).Source
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -O C:\Qt --external $sevenZip
          if($LASTEXITCODE -ne 0){throw 'QT_INSTALL_FAILED'}
      - name: Telecharger les deux veritables packs et verifier leurs SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Invoke-RestMethod 'https://raw.githubusercontent.com/mini56/ECU-Mems-Manager-Session-MAJ/main/manifest.json'
          if(-not $manifest.documentary_bases.fr.available -or -not $manifest.documentary_bases.en.available){
            throw 'DOCUMENTARY_MANIFEST_NOT_PUBLISHED'
          }
          New-Item -ItemType Directory -Force pack-verification | Out-Null
          foreach($lang in @('fr','en')){
            $entry=$manifest.documentary_bases.$lang
            $out="pack-verification/$lang.encrypted"
            Invoke-WebRequest -Uri $entry.release_url -OutFile $out -TimeoutSec 90 -MaximumRedirection 10
            $actual=(Get-FileHash -Path $out -Algorithm SHA256).Hash.ToLowerInvariant()
            if($actual -ne $entry.sha256){throw "PUBLISHED_$($lang)_SHA_MISMATCH"}
            Write-Host "PUBLISHED_$($lang)_SHA256_VERIFIED"
          }
      - name: Compiler le decodeur reel de SESSION avec les bases publiées
        shell: pwsh
        run: |
          @'
          cmake_minimum_required(VERSION 3.16)
          project(native_published_pack_test CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(Qt5 REQUIRED COMPONENTS Core Network)
          add_executable(real_pack_test
              bases/tests/real_published_windows_decrypt.cpp
              session-src/database/MemsDocumentaryEncryptedPack.cpp)
          target_include_directories(real_pack_test PRIVATE session-src/database)
          target_link_libraries(real_pack_test PRIVATE Qt5::Core Qt5::Network bcrypt)
          '@ | Set-Content CMakeLists.real-packs.txt -Encoding utf8
          New-Item -ItemType Directory -Force test-native | Out-Null
          Copy-Item CMakeLists.real-packs.txt test-native/CMakeLists.txt
          cmake -S test-native -B compiled-native -A x64 -DCMAKE_PREFIX_PATH='C:/Qt/5.15.2/msvc2019_64'
          if($LASTEXITCODE -ne 0){throw 'NATIVE_GCM_CMAKE_FAILED'}
          cmake --build compiled-native --config Release --parallel
          if($LASTEXITCODE -ne 0){throw 'NATIVE_GCM_COMPILE_FAILED'}
      - name: Tester secret GitHub contre le moteur AES-GCM Windows reel
        shell: pwsh
        env:
          MEMS_DOCUMENTARY_PUBLISH_PASSWORD: '${{ secrets.MEMS_DOCUMENTARY_PUBLISH_PASSWORD }}'
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrEmpty($env:MEMS_DOCUMENTARY_PUBLISH_PASSWORD)){
            throw 'PUBLISH_SECRET_NOT_CONFIGURED'
          }
          $qt='C:\Qt\5.15.2\msvc2019_64'
          & "$qt/bin/windeployqt.exe" --release --no-translations --compiler-runtime --dir compiled-native/Release compiled-native/Release/real_pack_test.exe
          if($LASTEXITCODE -ne 0){throw 'NATIVE_GCM_DEPLOY_FAILED'}
          & compiled-native/Release/real_pack_test.exe pack-verification/fr.encrypted pack-verification/en.encrypted
          if($LASTEXITCODE -ne 0){throw 'REAL_PACKS_GCM_PASSWORD_MISMATCH'}
          Write-Host 'REAL_FR_EN_PUBLISHED_AES_GCM_NATIVE_DECRYPTION_VERIFIED'
