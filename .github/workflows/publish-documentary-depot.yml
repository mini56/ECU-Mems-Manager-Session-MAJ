name: Publier les bases documentaires deposees
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bases/depot/*.encrypted'
      - 'bases/depot/*.encrypted.part1'
      - 'bases/depot/*.encrypted.part2'
      - '.github/workflows/publish-documentary-depot.yml'
permissions:
  contents: write
concurrency:
  group: documentary-depot-publication
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Reconstituer les bases en deux morceaux si necessaire
        shell: bash
        env:
          BASE_SHA: '${{ github.event.before }}'
          HEAD_SHA: '${{ github.sha }}'
          RUN_EVENT: '${{ github.event_name }}'
        run: |
          set -euo pipefail
          if [[ "$RUN_EVENT" == "workflow_dispatch" ]]; then
            find bases/depot -maxdepth 1 -type f \
              \( -name '*.encrypted' -o -name '*.encrypted.part1' -o -name '*.encrypted.part2' \) \
              | sort > changed-deposit-files.txt
            echo 'MANUAL_REAUDIT_ALL_ALREADY_UPLOADED_PACKS'
          else
            if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
              echo 'INVALID_PREVIOUS_COMMIT_SHA'
              exit 1
            fi
            git diff --diff-filter=AMR --name-only "$BASE_SHA" "$HEAD_SHA" -- bases/depot/ > changed-deposit-files.txt
          fi
          python3 bases/tools/assemble_deposit_parts.py \
            --depot bases/depot \
            --changed-list changed-deposit-files.txt \
            --output candidate-assets \
            --result assembled-packs.json
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          packs=json.load(open("assembled-packs.json",encoding="utf-8"))
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
              env.write("SHOULD_PUBLISH="+("true" if packs else "false")+"\n")
              if packs:
                  tag="mems-doc-"+datetime.now(timezone.utc).strftime("%Y%m%d")+"-"+os.environ["HEAD_SHA"][:9]
                  env.write("PUBLISH_TAG="+tag+"\n")
                  with open("selected-languages.txt","w",encoding="utf-8") as selected:
                      selected.write("".join(language+"\n" for language in sorted(packs)))
          print("COMPLETE_ENCRYPTED_BASES",list(packs))
          PY
      - name: Exiger les droits ecrits de redistribution
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        env:
          RIGHTS_OK: '${{ vars.MEMS_DOCUMENTARY_REDISTRIBUTION_AUTHORIZED }}'
          RIGHTS_REFERENCE: '${{ vars.MEMS_DOCUMENTARY_RIGHTS_REFERENCE }}'
        run: |
          set -euo pipefail
          if [[ "$RIGHTS_OK" != true || ! "$RIGHTS_REFERENCE" =~ .{8} ]]; then
            echo 'PUBLICATION_BLOQUEE_SANS_AUTORISATION_ECRITE'
            exit 1
          fi
      - name: Installer le controle cryptographique
        if: env.SHOULD_PUBLISH == 'true'
        run: python3 -m pip install --user 'cryptography>=42,<47'
      - name: Verifier integralement chaque langue avant publication
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        env:
          MEMS_DOCUMENTARY_PUBLISH_PASSWORD: '${{ secrets.MEMS_DOCUMENTARY_PUBLISH_PASSWORD }}'
          RIGHTS_REFERENCE: '${{ vars.MEMS_DOCUMENTARY_RIGHTS_REFERENCE }}'
        run: |
          set -euo pipefail
          set +x
          cp manifest.json verified-manifest.json
          while IFS= read -r language; do
            python3 bases/tools/verify_licensed_release_and_enable.py \
              --manifest verified-manifest.json \
              --asset-dir candidate-assets \
              --tag "$PUBLISH_TAG" \
              --language "$language" \
              --rights-confirmed \
              --rights-reference "$RIGHTS_REFERENCE"
          done < selected-languages.txt
      - name: Rendre les packs disponibles pour SESSION
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          gh release create "$PUBLISH_TAG" candidate-assets/*.encrypted \
            --repo mini56/ECU-Mems-Manager-Session-MAJ \
            --draft --title "Bases documentaires $PUBLISH_TAG" \
            --notes "Bases chiffrees controlees, avec autorisation de redistribution."
          gh release edit "$PUBLISH_TAG" \
            --repo mini56/ECU-Mems-Manager-Session-MAJ --draft=false
          mv verified-manifest.json manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m "Publier les bases documentaires $PUBLISH_TAG"
          git push origin HEAD:main
          echo 'DOCUMENTARY_RELEASE_AND_MANIFEST_UPDATED'
