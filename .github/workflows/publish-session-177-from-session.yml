name: Publier Setup SESSION 177 depuis la Release SESSION
run-name: SESSION 177 - Transfert Setup vers MAJ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-session-177-from-session.yml'
permissions:
  contents: write
concurrency:
  group: transfer-session-177-maj
  cancel-in-progress: false
jobs:
  transfer-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Charger le depot public MAJ
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recuperer les deux fichiers verifies de la Release SESSION 177
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.SESSION_RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo "::error::SESSION_RELEASE_READ_TOKEN non configure dans le depot MAJ."
            exit 1
          fi
          mkdir -p transfer
          GH_TOKEN="${SOURCE_TOKEN}" gh release download mems-session-build-177 \
            --repo mini56/ECU-Mems-Manager-Session \
            --pattern 'ECU-Mems-Manager-Session-177-Setup.exe' \
            --pattern 'SESSION-177-Setup.sha256' \
            --dir transfer
          cd transfer
          sha256sum --check --status SESSION-177-Setup.sha256
          test "$(stat -c '%s' ECU-Mems-Manager-Session-177-Setup.exe)" -eq 449481395
          test "$(head -c 2 ECU-Mems-Manager-Session-177-Setup.exe)" = MZ
          echo 'SESSION_177_SOURCE_SHA256_AND_SIZE_VERIFIED'
      - name: Publier uniquement Setup et SHA-256 sur MAJ
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=mems-session-build-177
          if gh release view "$tag" --repo mini56/ECU-Mems-Manager-Session-MAJ >/dev/null 2>&1; then
            echo "::error::La Release 177 existe deja sur MAJ : publication annulee pour eviter tout ecrasement."
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          ### Français

          **ECU MEMS Manager SESSION 177 — Connexion automatique MEMS 1.9**

          - Brancher le câble KKL compatible et le calculateur, puis cliquer sur Connecter.
          - Initialisation automatique K-Line à 5 bauds, diagnostic MEMS 1.x et lecture des valeurs et défauts dans les pages habituelles.
          - Prise en compte de l'écho du câble et des longueurs réelles des trames 0x80 et 0x7D.
          - Les connexions historiques MEMS 1.2, 1.3 et 1.6 restent inchangées.
          - Setup Windows x64 validé en installation et tests automatiques. **Validation sur ECU MEMS 1.9 réel encore nécessaire.**
          - Setup et empreinte SHA-256 uniquement, sans base documentaire constructeur ni code source.

          ---

          ### English

          **ECU MEMS Manager SESSION 177 — Automatic MEMS 1.9 connection**

          - Connect a compatible KKL cable and ECU, then click the usual Connect button.
          - Automatic five-baud K-Line wake-up, MEMS 1.x diagnostic commands and live data/fault readings in the regular pages.
          - Supports optional adapter echo and ECU-declared frame lengths for 0x80 and 0x7D.
          - Existing MEMS 1.2, 1.3 and 1.6 ROSCO connections remain unchanged.
          - Windows x64 installer passed automated installation tests. **Physical MEMS 1.9 ECU testing is still required.**
          - Only the Setup and SHA-256 checksum are provided; no manufacturer database or source code.
          NOTES
          gh release create "$tag" \
            transfer/ECU-Mems-Manager-Session-177-Setup.exe \
            transfer/SESSION-177-Setup.sha256 \
            --repo mini56/ECU-Mems-Manager-Session-MAJ \
            --title 'ECU MEMS Manager SESSION 177 - Setup Windows' \
            --notes-file release-notes.txt \
            --latest
          test "$(gh release view "$tag" --repo mini56/ECU-Mems-Manager-Session-MAJ --json assets --jq '.assets|length')" -eq 2
          echo 'SESSION_177_PUBLIC_SETUP_RELEASE_VERIFIED'
      - name: Actualiser uniquement la rubrique programme du manifeste MAJ
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          exe=Path('transfer/ECU-Mems-Manager-Session-177-Setup.exe')
          sha=hashlib.file_digest(exe.open('rb'),'sha256').hexdigest()
          path=Path('manifest.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          program=manifest.setdefault('program',{})
          program.update({
            'available':True,
            'version':'1.1.77',
            'release_url':'https://github.com/mini56/ECU-Mems-Manager-Session-MAJ/releases/download/mems-session-build-177/ECU-Mems-Manager-Session-177-Setup.exe',
            'sha256':sha,
          })
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SESSION_177_PROGRAM_MANIFEST_READY',sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publication programme SESSION 177 sur MAJ'
            git push origin HEAD:main
          fi
          echo 'SESSION_177_PUBLIC_MANIFEST_UPDATED'
