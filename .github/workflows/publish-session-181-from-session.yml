name: Publier Setup SESSION 181 depuis la Release SESSION
run-name: SESSION 181 - Transfert Setup vers MAJ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-session-181-from-session.yml'
permissions:
  contents: write
concurrency:
  group: transfer-session-181-maj
  cancel-in-progress: false
jobs:
  transfer-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Charger le depot public MAJ
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recuperer les deux fichiers verifies de la Release SESSION 181
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.SESSION_RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo "::error::SESSION_RELEASE_READ_TOKEN non configure dans le depot MAJ."
            exit 1
          fi
          mkdir -p transfer
          GH_TOKEN="${SOURCE_TOKEN}" gh release download mems-session-build-181 \
            --repo mini56/ECU-Mems-Manager-Session \
            --pattern 'ECU-Mems-Manager-Session-181-Setup.exe' \
            --pattern 'SESSION-181-Setup.sha256' \
            --dir transfer
          cd transfer
          sha256sum --check --status SESSION-181-Setup.sha256
          test "$(stat -c '%s' ECU-Mems-Manager-Session-181-Setup.exe)" -gt 100000000
          test "$(head -c 2 ECU-Mems-Manager-Session-181-Setup.exe)" = MZ
          echo 'SESSION_181_SOURCE_SHA256_AND_SIZE_VERIFIED'
      - name: Publier uniquement Setup et SHA-256 sur MAJ
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=mems-session-build-181
          if gh release view "$tag" --repo mini56/ECU-Mems-Manager-Session-MAJ >/dev/null 2>&1; then
            echo "::error::La Release 181 existe deja sur MAJ : publication annulee pour eviter tout ecrasement."
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          ### Français

          **ECU MEMS Manager SESSION 181 — Bouton MAJ et infobulles**

          - Le bouton orange de téléchargement affiche désormais entièrement le numéro de la nouvelle version.
          - L'icône d'aide qui masquait les derniers chiffres n'est plus superposée au bouton, mais son aide au survol reste accessible.
          - Infobulles corrigées dans le thème sombre : texte blanc sur fond sombre et contraste visible.
          - Le thème clair dispose de textes foncés sur un fond clair.
          - Aucune modification des lecteurs ECU, du tableau Analyse, des bases documentaires ou de l'IA.
          - Setup Windows x64, installation et tests UI automatiques de non-régression.
          - Setup et empreinte SHA-256 disponibles sans bases constructeurs.

          ---

          ### English

          **ECU MEMS Manager SESSION 181 — Update banner visibility and tooltip colors**

          - Full update version is visible in the orange download button without a bubble icon covering the digits.
          - Dark-theme tooltips now use high-contrast light text on dark backgrounds.
          - Light-theme tooltips use dark text on light backgrounds.
          - Existing ECU readers, Analysis views and documentary databases remain unchanged.
          - Windows x64 installer with real installation and UI regression tests.
          NOTES
          gh release create "$tag" \
            transfer/ECU-Mems-Manager-Session-181-Setup.exe \
            transfer/SESSION-181-Setup.sha256 \
            --repo mini56/ECU-Mems-Manager-Session-MAJ \
            --title 'ECU MEMS Manager SESSION 181 - Setup Windows' \
            --notes-file release-notes.txt \
            --latest
          test "$(gh release view "$tag" --repo mini56/ECU-Mems-Manager-Session-MAJ --json assets --jq '.assets|length')" -eq 2
          echo 'SESSION_181_PUBLIC_SETUP_RELEASE_VERIFIED'
      - name: Actualiser uniquement la rubrique programme du manifeste MAJ
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          exe=Path('transfer/ECU-Mems-Manager-Session-181-Setup.exe')
          sha=hashlib.file_digest(exe.open('rb'),'sha256').hexdigest()
          path=Path('manifest.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          program=manifest.setdefault('program',{})
          program.update({
            'available':True,
            'version':'1.1.81',
            'release_url':'https://github.com/mini56/ECU-Mems-Manager-Session-MAJ/releases/download/mems-session-build-181/ECU-Mems-Manager-Session-181-Setup.exe',
            'sha256':sha,
          })
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SESSION_181_PROGRAM_MANIFEST_READY',sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publication programme SESSION 181 sur MAJ'
            git push origin HEAD:main
          fi
          echo 'SESSION_181_PUBLIC_MANIFEST_UPDATED'
