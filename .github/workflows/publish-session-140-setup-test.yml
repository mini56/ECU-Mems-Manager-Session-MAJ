name: Publier SESSION 140 test - Setup sans base documentaire
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-session-140-setup-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-setup-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Telecharger et verifier le Setup Windows signe par SHA-256
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/mini56/ECU-Mems-Manager-Session/releases/download/session-140-admin-encrypted-documentary-TEST/ECU.MEMS.Manager.SESSION.Setup.exe'
          curl --fail --location --retry 3 --retry-delay 2 \
            --output ECU.MEMS.Manager.SESSION.Setup.exe "$url"
          printf '%s  %s\n' \
            37d79346be391ad94c0f1ce7eeca5b3c4c4b06a18bdd1f39302bd962251883cb \
            ECU.MEMS.Manager.SESSION.Setup.exe | sha256sum --check --status
          test "$(stat -c '%s' ECU.MEMS.Manager.SESSION.Setup.exe)" -eq 447324607
          test "$(head -c 2 ECU.MEMS.Manager.SESSION.Setup.exe)" = MZ
          sha256sum ECU.MEMS.Manager.SESSION.Setup.exe > SESSION-140-Setup.sha256
          echo SESSION_140_SOURCE_SHA256_VERIFIED
      - name: Mettre sur GitHub MAJ la version test du programme
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='mems-session-140-admin-encrypted-documentary-TEST'
          if gh release view "$tag" --repo mini56/ECU-Mems-Manager-Session-MAJ >/dev/null 2>&1; then
            echo 'TAG_ALREADY_PUBLISHED'
            exit 0
          fi
          gh release create "$tag" \
            ECU.MEMS.Manager.SESSION.Setup.exe SESSION-140-Setup.sha256 \
            --repo mini56/ECU-Mems-Manager-Session-MAJ \
            --title 'ECU MEMS Manager SESSION 140 - test mise a jour des bases chiffrees' \
            --notes 'Setup Windows de test : compilation, installation et lancement sur runner GitHub verifies. Ce Setup ne contient aucune documentation Rover : importer le ZIP local autorise dans la page Mise a jour des bases documentaires, en utilisant uniquement le mot de passe defini par l administrateur. L utilisateur ne peut pas creer son propre mot de passe ; l import ZIP non chiffre est desactive. Les bases ECU, expertes et les historiques sont independants et preserves. Les tests AES-GCM, refus des mauvais mots de passe, controle SQLite et sauvegarde ont reussi. La publication des bases constructeur n est pas incluse dans cette Release.' \
            --prerelease
          gh release view "$tag" --repo mini56/ECU-Mems-Manager-Session-MAJ \
            --json url,assets --jq '{url,assets:[.assets[].name]}'
