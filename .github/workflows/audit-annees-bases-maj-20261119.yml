name: AUDIT années des trois bases MAJ réelles - sans publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-annees-bases-maj-20261119.yml'
permissions:
  contents: read
jobs:
  audit-real-sqlite:
    name: Contrôler les années dans les SQLite chiffrées FR et EN en lecture seule
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Lire le catalogue officiel MAJ sans modifier les bases
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Charger la référence constructeur ECU existante sans la modifier
        uses: actions/checkout@v4
        with:
          repository: mini56/ECU-Mems-Manager-Session
          ref: fix-documentary-additive-session-161-20261118
          path: session-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /database/reference/
            /tools/build_rave_fr_documentary.py
            /tools/documentary_common.py
      - name: Installer le lecteur cryptographique AES-GCM
        run: |
          python3 -m pip install --disable-pip-version-check 'cryptography>=42,<47'
          python3 -m py_compile bases/tools/audit_verified_year_links.py
      - name: Télécharger exactement les trois packs publiés
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p packs
          python3 - <<'PY' > sources.tsv
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          m=json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          packs=[m["documentary_bases"]["fr"],
                 m["documentary_bases"]["fr"]["previous_packs"][0],
                 m["documentary_bases"]["en"]]
          for p in packs:
              parts=urlparse(p["release_url"]).path.split("/")
              assert "download" in parts and parts[-1].endswith(".encrypted")
              print(parts[-2]+"\t"+parts[-1])
          PY
          while IFS=$'\t' read -r tag asset; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir packs --clobber
          done < sources.tsv
          echo "THREE_OFFICIAL_ENCRYPTED_ASSETS_DOWNLOADED"
      - name: Authentifier, ouvrir en mémoire et auditer les enregistrements de périodes
        shell: bash
        env:
          MEMS_DOCUMENTARY_PUBLISH_PASSWORD: ${{ secrets.MEMS_DOCUMENTARY_PUBLISH_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          python3 bases/tools/audit_published_model_years.py \
            --manifest manifest.json --directory packs \
            --output audit-annees-maj-20261119.json
      - name: Relier en lecture seule VIN, périodes ECU et procédures exactes
        shell: bash
        env:
          PYTHONPATH: session-source/tools:bases/tools
          MEMS_DOCUMENTARY_PUBLISH_PASSWORD: ${{ secrets.MEMS_DOCUMENTARY_PUBLISH_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          python3 bases/tools/audit_verified_year_links.py             --manifest manifest.json --directory packs             --source-reference session-source/database/reference             --output audit-liaisons-annees-maj-20261119.json
      - name: Prouver l'intégration sans altérer le vrai SQLite
        shell: bash
        env:
          PYTHONPATH: bases/tools
          MEMS_DOCUMENTARY_PUBLISH_PASSWORD: ${{ secrets.MEMS_DOCUMENTARY_PUBLISH_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          python3 -m py_compile bases/tools/stage_verified_documentary_years.py
          python3 - <<'PY'
          import hashlib,io,json,os,sqlite3,tempfile,zipfile
          from pathlib import Path
          from audit_published_model_years import decrypt_pack
          from stage_verified_documentary_years import stage
          manifest=json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          previous=manifest["documentary_bases"]["fr"]["previous_packs"][0]
          original=Path("packs")/previous["release_url"].rsplit("/",1)[-1]
          h=hashlib.sha256(original.read_bytes()).hexdigest()
          assert h==previous["sha256"], "ORIGINAL_PUBLISHED_PACK_CHANGED"
          clear=decrypt_pack(original,h,os.environ["MEMS_DOCUMENTARY_PUBLISH_PASSWORD"])
          with zipfile.ZipFile(io.BytesIO(clear)) as z, tempfile.TemporaryDirectory() as tmp:
              src=Path(tmp)/"original.sqlite"
              src.write_bytes(z.read("mems_documentary_fr.sqlite"))
              original_sha=hashlib.sha256(src.read_bytes()).hexdigest()
              output=Path(tmp)/"staged.sqlite"
              counts=stage(src,Path("audit-liaisons-annees-maj-20261119.json"),output)
              assert counts=={"RCL0193FRE":5694}, "VERIFIED_ROW_COUNT_CHANGED"
              assert hashlib.sha256(src.read_bytes()).hexdigest()==original_sha,"SOURCE_SQLITE_MUTATED"
              with sqlite3.connect("file:"+str(output)+"?mode=ro",uri=True) as db:
                  count=db.execute("SELECT COUNT(*) FROM documentary_model_years").fetchone()[0]
                  assert count==5694, "INCOMPLETE_STAGE"
                  assert db.execute(
                      "SELECT COUNT(*) FROM documentary_model_years y "
                      "JOIN documentary_entries e USING(document_id,source_revision,entry_id) "
                      "WHERE e.document_id='RCL0193FRE' AND e.source_page=244").fetchone()[0]==12
                  assert db.execute(
                      "SELECT COUNT(*) FROM documentary_model_years y "
                      "JOIN documentary_entries e USING(document_id,source_revision,entry_id) "
                      "WHERE e.document_id='RCL0193FRE' AND e.source_page=251").fetchone()[0]==35
                  assert db.execute(
                      "SELECT COUNT(DISTINCT vehicle_years) FROM documentary_model_years"
                  ).fetchone()[0]==1
                  assert db.execute("SELECT DISTINCT vehicle_years FROM documentary_model_years").fetchone()[0]=="96+"
                  assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
                  assert db.execute("PRAGMA foreign_key_check").fetchall()==[]
          assert hashlib.sha256(original.read_bytes()).hexdigest()==h,"PUBLISHED_PACK_MUTATED"
          print("PASS_REAL_FR_RAVE_5694_VERIFIED_PERIODS_96_PLUS_PAGE244_12_PAGE251_35")
          print("PASS_ORIGINAL_SQLITE_UNCHANGED_STAGING_DESTROYED_AFTER_TEST")
          PY

      - name: Conserver uniquement les preuves de dates, jamais les bases
        uses: actions/upload-artifact@v4
        with:
          name: audit-annees-et-liaisons-maj-20261119
          path: |
            audit-annees-maj-20261119.json
            audit-liaisons-annees-maj-20261119.json
          if-no-files-found: error
          retention-days: 7
