name: Vérifier le système d'activation FR EN sans publier
on:
  push:
    branches: [main, fix-multidocument-updates-20261113]
    paths:
      - 'bases/tools/verify_licensed_release_and_enable.py'
      - '.github/workflows/test-documentary-release-activation.yml'
permissions:
  contents: read
jobs:
  test-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Charger les sources du programme pour les tests non publiables
        uses: actions/checkout@v4
        with:
          repository: mini56/ECU-Mems-Manager-Session
          ref: 0fc83fbc03fc663001c915e1ae05b9d366fa92d4
          path: mems-source
      - name: Préparer les bibliothèques cryptographiques
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user 'cryptography>=42,<47'
      - name: Construire deux vrais schémas avec données de test non publiées
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mems-source/output/rave-fr mems-source/output/rave-en
          python3 mems-source/tools/build_rave_fr_documentary.py \
            --reference-root mems-source/database/reference \
            --output mems-source/output/rave-fr/mems_documentary_fr.sqlite
          python3 mems-source/tools/test_documentary_fixture.py \
            --source mems-source/output/rave-fr
          python3 mems-source/tools/test_documentary_multisource_fixture.py \
            --source mems-source/output/rave-fr
          python3 mems-source/tools/build_rave_en_documentary.py \
            --parts mems-source/database/documentary/parts \
            --output mems-source/output/rave-en
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          out=Path('temporary-synthetic-packs')
          out.mkdir(exist_ok=True)
          for lang in ('fr','en'):
              root=Path('mems-source/output/rave-'+lang)
              with zipfile.ZipFile(out/(lang+'.zip'),'w',
                                   zipfile.ZIP_DEFLATED) as archive:
                  for file in sorted(root.rglob('*')):
                      if file.is_file() and (
                          file.suffix=='.sqlite' or file.parent.name=='images'):
                          archive.write(file,file.relative_to(root))
              print('PREPARED_TEMPORARY_NONPUBLIC_TEST',lang)
          PY
      - name: Vérifier nouveaux packs FR/EN et mises à jour répétées
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,struct,sys,shutil
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          src=Path('bases/tools/verify_licensed_release_and_enable.py')
          spec=importlib.util.spec_from_file_location('activation',src)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          temp=Path('temporary-synthetic-packs')
          test_secret='DO_NOT_USE_CI_ONLY_SyntheticPassword_2026'
          hashes={}
          for lang in ('fr','en'):
              plain=(temp/(lang+'.zip')).read_bytes()
              docs=module.validate_zip(plain,lang)
              assert len(docs)>=1
              salt,nonce=os.urandom(16),os.urandom(12)
              head=b'MEMSDOC1'+bytes([1])+salt+nonce+struct.pack('<Q',len(plain))
              key=hashlib.pbkdf2_hmac('sha256',test_secret.encode(),
                                      salt,210000,32)
              payload=head+AESGCM(key).encrypt(nonce,plain,head)
              path=temp/('MEMS-DOC-'+lang.upper()+'-CI-20261113.encrypted')
              path.write_bytes(payload)
              sha,verified_docs=module.validate_encrypted(path,lang,test_secret)
              assert sha==hashlib.sha256(payload).hexdigest()
              assert verified_docs==docs
              hashes[lang]=sha
              try:
                  module.validate_encrypted(path,lang,'BAD_PASSWORD')
              except RuntimeError:
                  pass
              else:
                  raise AssertionError('WRONG_PASSWORD_ACCEPTED')
              print('FUTURE_PACK_AUTHENTICATION_VERIFIED',lang,len(docs))
          manifest=temp/'manifest.json'
          shutil.copy2('manifest.json',manifest)
          os.environ['MEMS_DOCUMENTARY_PUBLISH_PASSWORD']=test_secret
          for i,tag in enumerate(('mems-doc-ci-v1','mems-doc-ci-v2')):
              if i:
                  # A second published snapshot must accept a later release tag.
                  # The current data is unchanged; production requires a new version.
                  pass
              sys.argv=[str(src),'--manifest',str(manifest),
                        '--asset-dir',str(temp),'--tag',tag,'--language','both',
                        '--rights-confirmed',
                        '--rights-reference','SYNTHETIC_CI_TEST_NO_REAL_LICENSE']
              module.main()
          result=json.loads(manifest.read_text())
          for lang in ('fr','en'):
              assert result['documentary_bases'][lang]['available']
              assert result['documentary_bases'][lang]['sha256']==hashes[lang]
              assert result['documentary_bases'][lang]['version']==lang+'-mems-doc-ci-v2'
          assert all(not json.loads(Path('manifest.json').read_text())
                     ['documentary_bases'][lang]['available']
                     for lang in ('fr','en'))
          print('SYNTHETIC_FR_EN_DYNAMIC_MAJ_MANIFEST_GATE_PASS')
          PY
      - name: Vérifier le refus des suppressions et des images altérées
        run: python3 -m unittest discover -s bases/tests -p test_dynamic_documentary_updates.py -v
