name: Publier Setup SESSION 175 depuis le depot prive
run-name: SESSION 175 - Transfert Setup vers MAJ
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transfer-session-175-maj
  cancel-in-progress: false
jobs:
  transfer-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Charger le depot public MAJ
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recuperer les DEUX fichiers de la Release privee 175
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.SESSION_RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo "::error::Configurer le secret Actions SESSION_RELEASE_READ_TOKEN dans MAJ (jeton GitHub lecture seule du depot prive SESSION)."
            exit 1
          fi
          mkdir -p transfer
          GH_TOKEN="${SOURCE_TOKEN}" gh release download mems-session-build-175 \
            --repo mini56/ECU-Mems-Manager-Session \
            --pattern 'ECU-Mems-Manager-Session-175-Setup.exe' \
            --pattern 'SESSION-175-Setup.sha256' \
            --dir transfer
          cd transfer
          sha256sum --check --status SESSION-175-Setup.sha256
          test "$(stat -c '%s' ECU-Mems-Manager-Session-175-Setup.exe)" -eq 449678212
          test "$(head -c 2 ECU-Mems-Manager-Session-175-Setup.exe)" = MZ
          echo 'SESSION_175_PRIVATE_SOURCE_SHA256_AND_SIZE_VERIFIED'
      - name: Publier uniquement Setup et SHA-256 sur MAJ
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=mems-session-build-175
          if gh release view "$tag" --repo mini56/ECU-Mems-Manager-Session-MAJ >/dev/null 2>&1; then
            echo "::error::La Release 175 existe deja sur MAJ : publication annulee pour eviter tout ecrasement."
            exit 1
          fi
          gh release create "$tag" \
            transfer/ECU-Mems-Manager-Session-175-Setup.exe \
            transfer/SESSION-175-Setup.sha256 \
            --repo mini56/ECU-Mems-Manager-Session-MAJ \
            --title 'ECU MEMS Manager SESSION 175 - Setup Windows' \
            --notes 'SESSION 175 : theme clair, cadrans blancs a bord chrome, boutons Effacer a fond blanc et retour immediat au theme sombre. Setup Windows x64 de test. Aucun code source ni base documentaire constructeur depose dans cette Release. Fichier SHA-256 joint.' \
            --latest
          test "$(gh release view "$tag" --repo mini56/ECU-Mems-Manager-Session-MAJ --json assets --jq '.assets|length')" -eq 2
          echo 'SESSION_175_PUBLIC_SETUP_RELEASE_VERIFIED'
      - name: Actualiser uniquement la rubrique programme du manifeste MAJ
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          exe=Path('transfer/ECU-Mems-Manager-Session-175-Setup.exe')
          sha=hashlib.file_digest(exe.open('rb'),'sha256').hexdigest()
          path=Path('manifest.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          program=manifest.setdefault('program',{})
          program.update({
            'available':True,
            'version':'1.1.75',
            'release_url':'https://github.com/mini56/ECU-Mems-Manager-Session-MAJ/releases/download/mems-session-build-175/ECU-Mems-Manager-Session-175-Setup.exe',
            'sha256':sha,
          })
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SESSION_175_PROGRAM_MANIFEST_READY',sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publication programme SESSION 175 sur MAJ'
            git push origin HEAD:main
          fi
          echo 'SESSION_175_PUBLIC_MANIFEST_UPDATED'
