name: Publier Setup SESSION 182 depuis la Release SESSION
run-name: SESSION 182 - Transfert Setup vers MAJ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-session-182-from-session.yml'
permissions:
  contents: write
concurrency:
  group: transfer-session-182-maj
  cancel-in-progress: false
jobs:
  transfer-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Charger le depot public MAJ
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recuperer les deux fichiers verifies de la Release SESSION 182
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.SESSION_RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo "::error::SESSION_RELEASE_READ_TOKEN non configure dans le depot MAJ."
            exit 1
          fi
          mkdir -p transfer
          GH_TOKEN="${SOURCE_TOKEN}" gh release download mems-session-build-182 \
            --repo mini56/ECU-Mems-Manager-Session \
            --pattern 'ECU-Mems-Manager-Session-182-Setup.exe' \
            --pattern 'SESSION-182-Setup.sha256' \
            --dir transfer
          cd transfer
          sha256sum --check --status SESSION-182-Setup.sha256
          test "$(stat -c '%s' ECU-Mems-Manager-Session-182-Setup.exe)" -gt 100000000
          test "$(head -c 2 ECU-Mems-Manager-Session-182-Setup.exe)" = MZ
          echo 'SESSION_182_SOURCE_SHA256_AND_SIZE_VERIFIED'
      - name: Publier uniquement Setup et SHA-256 sur MAJ
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=mems-session-build-182
          if gh release view "$tag" --repo mini56/ECU-Mems-Manager-Session-MAJ >/dev/null 2>&1; then
            echo "::error::La Release 182 existe deja sur MAJ : publication annulee pour eviter tout ecrasement."
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          ### Français

          **ECU MEMS Manager SESSION 182 — Analyse : boutons Courbes / Colonnes et bulles d'aide**

          - Deux boutons distincts Courbes et Colonnes, sur la même ligne que Charger un fichier CSV/TXT et centrés horizontalement.
          - Suppression à la source du bandeau supplémentaire qui déplaçait Charger un fichier.
          - Icône d'aide placée après les deux boutons, sans masquer leur texte.
          - Thème clair : bulles d'aide orange et blanc ; thème sombre conservé.
          - Aide et libellés actualisés dans les six langues du programme.
          - Sélection des voies, graphiques, données CSV/TXT, lecteurs ECU, IA et bases documentaires préservés.
          - Setup Windows x64 avec tests automatisés du programme installé et de la page Analyse.
          - Installation autonome ; bases documentaires constructeur distribuées séparément.

          ---

          ### English

          **ECU MEMS Manager SESSION 182 — Centered Curves/Columns controls and Help icons**

          - Separate Curves and Columns buttons centered on the same row as Load CSV/TXT.
          - Removed the duplicate native header that displaced the Load button.
          - Help icon after both buttons; no text overlap.
          - Orange and white Help bubbles in light mode, original dark-mode appearance retained.
          - Help and translations updated in six languages.
          - Existing right-side selection, charts, CSV loading, ECU protocols, AI and documentary packs unchanged.
          - Windows x64 installer verified with installed-application UI tests.
          NOTES
          gh release create "$tag" \
            transfer/ECU-Mems-Manager-Session-182-Setup.exe \
            transfer/SESSION-182-Setup.sha256 \
            --repo mini56/ECU-Mems-Manager-Session-MAJ \
            --title 'ECU MEMS Manager SESSION 182 - Setup Windows' \
            --notes-file release-notes.txt \
            --latest
          test "$(gh release view "$tag" --repo mini56/ECU-Mems-Manager-Session-MAJ --json assets --jq '.assets|length')" -eq 2
          echo 'SESSION_182_PUBLIC_SETUP_RELEASE_VERIFIED'
      - name: Actualiser uniquement la rubrique programme du manifeste MAJ
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          exe=Path('transfer/ECU-Mems-Manager-Session-182-Setup.exe')
          sha=hashlib.file_digest(exe.open('rb'),'sha256').hexdigest()
          path=Path('manifest.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          program=manifest.setdefault('program',{})
          program.update({
            'available':True,
            'version':'1.1.82',
            'release_url':'https://github.com/mini56/ECU-Mems-Manager-Session-MAJ/releases/download/mems-session-build-182/ECU-Mems-Manager-Session-182-Setup.exe',
            'sha256':sha,
          })
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SESSION_182_PROGRAM_MANIFEST_READY',sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publication programme SESSION 182 sur MAJ'
            git push origin HEAD:main
          fi
          echo 'SESSION_182_PUBLIC_MANIFEST_UPDATED'
