name: Controle du schema documentaire multi-documents

on:
  push:
    branches:
      - main
    paths:
      - 'bases/schema_multidoc_v1.sql'
      - 'bases/tests/**'
      - 'manifest.json'
      - '.github/workflows/verify-multidocument-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-schema-multisource:
    name: Ajouter plusieurs manuels sans perdre les autres sources ou bases ECU
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verifier plusieurs documents par langue, revisions, conflits et rollback
        run: python bases/tests/test_schema_multidoc.py
      - name: Verifier les six langues et toutes les bases réellement publiées
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert m['schema_version']==2
          assert m['documentary_schema']=='mems-documentary-multisource-v1'
          assert set(m['documentary_bases'])=={'fr','en','pt','es','it','de'}
          assert not m['program']['available']
          import re
          for code,entry in m['documentary_bases'].items():
              assert entry['language']==code
              assert (root/'bases'/code/'README.md').is_file()
              assert entry['database_file']==f'mems_documentary_{code}.sqlite'
              docs=entry['published_documents']
              assert entry['document_count']==len(docs)
              if entry['available']:
                  assert len(docs)>0
                  assert len({(d['document_id'],d['source_revision']) for d in docs})==len(docs)
                  assert all(d['source_pages']>0 and re.fullmatch(r'[a-f0-9]{64}',d['source_sha256']) for d in docs)
                  assert re.fullmatch(r'[a-f0-9]{64}',entry['sha256'])
                  assert entry['release_url'].startswith(
                      'https://github.com/mini56/ECU-Mems-Manager-Session-MAJ/releases/download/')
                  assert entry['installation_password_required']
                  assert entry['encrypted_package_required']
              else:
                  assert not docs and entry['release_url'] is None
          print('PASS_MAJ_SIX_LANGUAGES_DYNAMIC_MULTI_DOCUMENT_MANIFEST')
          PY
